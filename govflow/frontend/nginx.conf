server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side (BrowserRouter) routing -- every
    # unknown path must fall back to index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
